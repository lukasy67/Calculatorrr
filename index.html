<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Páginas</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin-top: 0; margin-bottom: 0.5rem; }
    p.sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }
    input {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.25rem;
      border-radius: 0.5rem;
      border: 2px solid #334155;
      background: #0f172a;
      color: #fff;
      text-align: center;
      outline: none;
      margin-bottom: 1rem;
    }
    input:focus { border-color: #38bdf8; }
    .result {
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-top: 1rem;
      border: 1px solid #334155;
    }
    .result-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.2;
    }
    .result-detail {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Buscador de Páginas</h1>
    <p class="sub">12 nombres por página • Inicia en pág. 8</p>
    <input type="number" id="numInput" placeholder="Ingresa un número (1-350)" min="1" max="350" inputmode="numeric">
    <div class="result" id="resBox" style="display: none;">
      <div>Página asignada</div>
      <div class="result-number" id="pageOutput">-</div>
      <div class="result-detail" id="detailOutput"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('numInput');
    const resBox = document.getElementById('resBox');
    const pageOutput = document.getElementById('pageOutput');
    const detailOutput = document.getElementById('detailOutput');

    input.addEventListener('input', () => {
      const val = parseInt(input.value, 10);
      if (isNaN(val) || val <= 0) {
        resBox.style.display = 'none';
        return;
      }
      const page = 8 + Math.floor((val - 1) / 12);
      const startNum = 1 + (page - 8) * 12;
      const endNum = startNum + 11;

      pageOutput.textContent = page;
      detailOutput.textContent = `La página ${page} abarca del ${startNum} al ${endNum}`;
      resBox.style.display = 'block';
    });
  </script>
</body>
</html>
